# 完整个人维护配置；原始需求与固定样本见 rule_framework/personal-maintenance.md。
# WeChat 所需类型若缺少已验证映射，整项 Task 回退，后续 Task 继续。
settings:
  author: jqyisbest
  repo: https://github.com/jqyisbest/ios_rule_script
  timezone: Asia/Shanghai
  hooks_dir: rule_framework/hooks
  dry_run: false
missions:
  - targets:
      - rule/Clash/**/*.yaml
      - rule/Clash/**/*.list
    name: 移除 Clash 列表中的全部 ASN
    sop: remove_asn_globally
  # Quantumult X 需要保留每个现有规则集自己的策略名。
  - name: 补充 OpenAI 分流域名
    targets:
      - rule/Clash/OpenAI/*.yaml
      - rule/Clash/OpenAI/*.list
      - rule/Loon/OpenAI/*.list
      - rule/Shadowrocket/OpenAI/*.list
      - rule/Surge/OpenAI/*.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - &openai_domain_1
            type: domain_suffix
            value: oaistatsig.com
  - name: 补充 OpenAI 分流域名（Quantumult X）
    targets:
      - rule/QuantumultX/OpenAI/OpenAI.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - <<: *openai_domain_1
            policy: OpenAI
  - name: 补充 Claude 分流域名
    targets:
      - rule/Clash/Claude/*.yaml
      - rule/Clash/Claude/*.list
      - rule/Loon/Claude/*.list
      - rule/Shadowrocket/Claude/*.list
      - rule/Surge/Claude/*.list
      - rule/Clash/Anthropic/*.yaml
      - rule/Clash/Anthropic/*.list
      - rule/Loon/Anthropic/*.list
      - rule/Shadowrocket/Anthropic/*.list
      - rule/Surge/Anthropic/*.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - &claude_domain_1
            type: domain_suffix
            value: claude.com
          - &claude_domain_2
            type: domain_suffix
            value: claudeusercontent.com
          - &claude_domain_3
            type: domain_suffix
            value: claudemcpcontent.com
          - &claude_desktop_domain
            type: domain_suffix
            value: claude.app
          - &claude_short_link
            type: domain
            value: clau.de
  - name: 补充 Claude 分流域名（Quantumult X）
    targets:
      - rule/QuantumultX/Claude/Claude.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - <<: *claude_domain_1
            policy: Claude
          - <<: *claude_domain_2
            policy: Claude
          - <<: *claude_domain_3
            policy: Claude
          - <<: *claude_desktop_domain
            policy: Claude
          - <<: *claude_short_link
            policy: Claude
  - name: 补充 Anthropic 分流域名（Quantumult X）
    targets:
      - rule/QuantumultX/Anthropic/Anthropic.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - <<: *claude_domain_1
            policy: Anthropic
          - <<: *claude_domain_2
            policy: Anthropic
          - <<: *claude_domain_3
            policy: Anthropic
          - <<: *claude_desktop_domain
            policy: Anthropic
          - <<: *claude_short_link
            policy: Anthropic
  - name: 补充 Gemini 分流域名
    targets:
      - rule/Clash/Gemini/*.yaml
      - rule/Clash/Gemini/*.list
      - rule/Loon/Gemini/*.list
      - rule/Shadowrocket/Gemini/*.list
      - rule/Surge/Gemini/*.list
      - rule/Clash/BardAI/*.yaml
      - rule/Clash/BardAI/*.list
      - rule/Loon/BardAI/*.list
      - rule/Shadowrocket/BardAI/*.list
      - rule/Surge/BardAI/*.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - &gemini_domain_1
            type: domain
            value: aistudio.google.com
          - &gemini_domain_2
            type: domain
            value: notebook.google.com
          - &gemini_domain_3
            type: domain
            value: notebooklm.google.com
          - &gemini_domain_4
            type: domain
            value: notebooklm.google
  - name: 补充 Gemini 分流域名（Quantumult X）
    targets:
      - rule/QuantumultX/Gemini/Gemini.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - <<: *gemini_domain_1
            policy: Gemini
          - <<: *gemini_domain_2
            policy: Gemini
          - <<: *gemini_domain_3
            policy: Gemini
          - <<: *gemini_domain_4
            policy: Gemini
  - name: 补充 BardAI 分流域名（Quantumult X）
    targets:
      - rule/QuantumultX/BardAI/BardAI.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - <<: *gemini_domain_1
            policy: BardAI
          - <<: *gemini_domain_2
            policy: BardAI
          - <<: *gemini_domain_3
            policy: BardAI
          - <<: *gemini_domain_4
            policy: BardAI
  - name: 补充 Microsoft Copilot 分流域名
    targets:
      - rule/Clash/Copilot/*.yaml
      - rule/Clash/Copilot/*.list
      - rule/Loon/Copilot/*.list
      - rule/Shadowrocket/Copilot/*.list
      - rule/Surge/Copilot/*.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - &microsoftcopilot_domain_1
            type: domain
            value: copilot.cloud.microsoft
  - name: 补充 Copilot 分流域名（Quantumult X）
    targets:
      - rule/QuantumultX/Copilot/Copilot.list
    actions:
      - action: add_rule
        insert:
          position: after_header
        rules:
          - <<: *microsoftcopilot_domain_1
            policy: Copilot
  - name: 维护 DeepSeek 独立分流规则
    targets:
      - rule/Clash/DeepSeek/DeepSeek.yaml
      - rule/Clash/DeepSeek/DeepSeek.list
      - rule/Loon/DeepSeek/DeepSeek.list
      - rule/Shadowrocket/DeepSeek/DeepSeek.list
      - rule/Surge/DeepSeek/DeepSeek.list
    actions:
      - action: add_rule
        rules:
          - &deepseek_domain_1
            type: domain_suffix
            value: deepseek.com
  - name: 维护 DeepSeek 独立分流规则（Quantumult X）
    targets:
      - rule/QuantumultX/DeepSeek/DeepSeek.list
    actions:
      - action: add_rule
        rules:
          - <<: *deepseek_domain_1
            policy: DeepSeek
  - name: 维护 Perplexity 独立分流规则
    targets:
      - rule/Clash/Perplexity/Perplexity.yaml
      - rule/Clash/Perplexity/Perplexity.list
      - rule/Loon/Perplexity/Perplexity.list
      - rule/Shadowrocket/Perplexity/Perplexity.list
      - rule/Surge/Perplexity/Perplexity.list
    actions:
      - action: add_rule
        rules:
          - &perplexity_domain_1
            type: domain_suffix
            value: perplexity.ai
  - name: 维护 Perplexity 独立分流规则（Quantumult X）
    targets:
      - rule/QuantumultX/Perplexity/Perplexity.list
    actions:
      - action: add_rule
        rules:
          - <<: *perplexity_domain_1
            policy: Perplexity
  - name: 维护 Grok 独立分流规则
    targets:
      - rule/Clash/Grok/Grok.yaml
      - rule/Clash/Grok/Grok.list
      - rule/Loon/Grok/Grok.list
      - rule/Shadowrocket/Grok/Grok.list
      - rule/Surge/Grok/Grok.list
    actions:
      - action: add_rule
        rules:
          - &grok_domain_1
            type: domain_suffix
            value: grok.com
          - &grok_domain_2
            type: domain_suffix
            value: x.ai
  - name: 维护 Grok 独立分流规则（Quantumult X）
    targets:
      - rule/QuantumultX/Grok/Grok.list
    actions:
      - action: add_rule
        rules:
          - <<: *grok_domain_1
            policy: Grok
          - <<: *grok_domain_2
            policy: Grok
  - name: 维护 Mistral 独立分流规则
    targets:
      - rule/Clash/Mistral/Mistral.yaml
      - rule/Clash/Mistral/Mistral.list
      - rule/Loon/Mistral/Mistral.list
      - rule/Shadowrocket/Mistral/Mistral.list
      - rule/Surge/Mistral/Mistral.list
    actions:
      - action: add_rule
        rules:
          - &mistral_domain_1
            type: domain_suffix
            value: mistral.ai
  - name: 维护 Mistral 独立分流规则（Quantumult X）
    targets:
      - rule/QuantumultX/Mistral/Mistral.list
    actions:
      - action: add_rule
        rules:
          - <<: *mistral_domain_1
            policy: Mistral
  - name: 维护 Poe 独立分流规则
    targets:
      - rule/Clash/Poe/Poe.yaml
      - rule/Clash/Poe/Poe.list
      - rule/Loon/Poe/Poe.list
      - rule/Shadowrocket/Poe/Poe.list
      - rule/Surge/Poe/Poe.list
    actions:
      - action: add_rule
        rules:
          - &poe_domain_1
            type: domain_suffix
            value: poe.com
          - &poe_domain_2
            type: domain_suffix
            value: poecdn.net
  - name: 维护 Poe 独立分流规则（Quantumult X）
    targets:
      - rule/QuantumultX/Poe/Poe.list
    actions:
      - action: add_rule
        rules:
          - <<: *poe_domain_1
            policy: Poe
          - <<: *poe_domain_2
            policy: Poe
  - name: 维护 GitHub Copilot 独立分流规则
    targets:
      - rule/Clash/GitHubCopilot/GitHubCopilot.yaml
      - rule/Clash/GitHubCopilot/GitHubCopilot.list
      - rule/Loon/GitHubCopilot/GitHubCopilot.list
      - rule/Shadowrocket/GitHubCopilot/GitHubCopilot.list
      - rule/Surge/GitHubCopilot/GitHubCopilot.list
    actions:
      - action: add_rule
        rules:
          - &githubcopilot_domain_1
            type: domain_suffix
            value: githubcopilot.com
          - &githubcopilot_domain_2
            type: domain
            value: copilot-proxy.githubusercontent.com
          - &githubcopilot_domain_3
            type: domain
            value: copilot-telemetry.githubusercontent.com
          - &githubcopilot_domain_4
            type: domain
            value: origin-tracker.githubusercontent.com
  - name: 维护 GitHub Copilot 独立分流规则（Quantumult X）
    targets:
      - rule/QuantumultX/GitHubCopilot/GitHubCopilot.list
    actions:
      - action: add_rule
        rules:
          - <<: *githubcopilot_domain_1
            policy: GitHubCopilot
          - <<: *githubcopilot_domain_2
            policy: GitHubCopilot
          - <<: *githubcopilot_domain_3
            policy: GitHubCopilot
          - <<: *githubcopilot_domain_4
            policy: GitHubCopilot
  - targets:
      - rule/Surge/WeChat/WeChat.list
    actions:
      - action: custom_hook
        script: personal_maintenance.py
        function: build_clash_wechat
    name: 从 Surge 生成个人 Clash WeChat
  - targets:
      - rule/Loon/WeChat/WeChat.list
    actions:
      - action: custom_hook
        script: personal_maintenance.py
        function: build_loon_wechat
    name: 合并 Surge 与 Loon WeChat
  - targets:
      - rule/Clash/ChinaMax/ChinaMax_Classical.yaml
    name: 移除 ChinaMax 的 ASN 132203
    sop: remove_asn_globally
    asn: '132203'
  - targets:
      - rule/Clash/GlobalMedia/GlobalMedia_Classical.yaml
      - rule/Surge/GlobalMedia/GlobalMedia_All_No_Resolve.list
    actions:
      - action: remove_rule
        match:
          type: domain
          value: gemini.google.com
      - action: remove_rule
        match:
          type: domain
          value: notebooklm.google.com
    name: 精确移除 GlobalMedia 中两个域名
  - targets:
      - rewrite/Loon/AdvertisingLite/AdvertisingLite.plugin
    actions:
      - action: custom_hook
        script: personal_maintenance.py
        function: normalize_advertising_lite
      - action: add_rewrite
        insert:
          after: '[Rewrite]'
        rewrites:
          - url_pattern: ^https?:\/\/tjbappweb\.health\.ikang\.com\/api\/(?:shoppingCart\/mayAlsoLike|search\/hotword)
            reject_type: reject-dict
          - url_pattern: ^https?:\/\/booking\.bestwehotel\.com\/proxy\/trip-hotel-banner\/activity\/getActivityInfo
            reject_type: reject-200
          - url_pattern: ^https?:\/\/booking\.bestwehotel\.com\/proxy\/trip-client-monitor\/log
            reject_type: reject-200
          - url_pattern: ^https?:\/\/booking\.bestwehotel\.com\/proxy\/trip-logs-application
            reject_type: reject-200
          - url_pattern: ^https?:\/\/quickorder\.dailiantong\.com\.cn\/api\/share\/(?:GetAdvertising|GetPantnerAd|GetOpenScreenAdInfoNew)
            reject_type: reject-dict
          - url_pattern: ^https?:\/\/api-ios\.zhipin\.com\/api\/zpCommon\/user\/startupAd
            reject_type: reject-200
          - url_pattern: ^https?:\/\/api-ios\.zhipin\.com\/api\/zpCommon\/upgrade\/check
            reject_type: reject-200
      - action: add_mitm
        hostnames:
          - tjbappweb.health.ikang.com
          - booking.bestwehotel.com
          - quickorder.dailiantong.com.cn
          - api.iturrit.com
          - api-ios.zhipin.com
    name: 调整 Loon AdvertisingLite
  - targets:
      - rule/Loon/TelegramSG/TelegramSG.list
    actions:
      - action: add_rule
        rules:
          - type: asn
            value: '44907'
          - type: asn
            value: '62014'
    name: 生成 TelegramSG
  - targets:
      - rule/Loon/TelegramUS/TelegramUS.list
    actions:
      - action: add_rule
        rules:
          - type: asn
            value: '59930'
    name: 生成 TelegramUS
  - targets:
      - rule/Loon/TelegramNL/TelegramNL.list
    actions:
      - action: add_rule
        rules:
          - type: asn
            value: '62041'
          - type: asn
            value: '211157'
          - type: ip
            value: 5.28.192.0/18
          - type: ip
            value: 109.239.140.0/24
    name: 生成 TelegramNL
  - name: 移除 openapi.boc.cn 的 MITM
    targets:
      - rewrite/Loon/AdvertisingLite/AdvertisingLite.plugin
      - rewrite/Surge/AdvertisingLite/AdvertisingLite.sgmodule
      - rewrite/Surge/AdvertisingLite/AdvertisingLite_Mock.sgmodule
      - rewrite/Shadowrocket/AdvertisingLite/AdvertisingLite.sgmodule
      - rewrite/QuantumultX/AdvertisingLite/AdvertisingLite.conf
      - rewrite/Stash/AdvertisingLite/AdvertisingLite.stoverride
    actions:
      - action: remove_mitm
        hostnames:
          - openapi.boc.cn
