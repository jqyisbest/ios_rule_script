name: Sync Fork and Modify Content

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync_and_merge.yaml'
  schedule:
    - cron: '0 20 * * *'  # 20:00 UTC daily; 04:00 Asia/Shanghai on the following day

permissions:
  contents: write

concurrency:
  group: sync-and-modify-${{ github.repository }}-master
  cancel-in-progress: false

env:
  PUBLICATION_BRANCH: master

defaults:
  run:
    shell: bash

jobs:
  sync-and-modify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'

      - name: Configure Upstream Remote
        run: git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git || true

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Framework Dependencies
        run: python -m pip install -r rule_framework/requirements.txt

      - name: Check Mission Configuration
        run: |
          if [ ! -f modifier_mission_config.yaml ]; then
            echo '::error::Provision modifier_mission_config.yaml and its referenced hooks in the checkout before running this workflow.' | tee modifier_console.log
            exit 1
          fi

      - name: Modify Files
        run: |
          maintenance_timer=()
          if [ -x /usr/bin/time ]; then
            maintenance_timer=(/usr/bin/time -f 'Maintenance resources: peak_rss_kib=%M elapsed_seconds=%e')
          fi
          "${maintenance_timer[@]}" python rule_framework/main.py modifier_mission_config.yaml \
            --sync-upstream \
            --publish --remote origin --branch "$PUBLICATION_BRANCH" \
            --log-file modifier_logs.log 2>&1 | tee modifier_console.log

      - name: Verify Complete Personal Maintenance
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from ruamel.yaml import YAML
          config = YAML(typ='safe').load(Path('modifier_mission_config.yaml').read_text(encoding='utf-8'))
          expected = len(config.get('missions', config.get('tasks', [])))
          if expected < 1:
              raise SystemExit('At least one personal maintenance Task required.')
          text = Path('modifier_logs.log').read_text(encoding='utf-8')
          summaries = re.findall(r'Task Results: success=(\d+), failed=(\d+), skipped=(\d+)', text)
          if not summaries or tuple(map(int, summaries[-1])) != (expected, 0, 0):
              raise SystemExit(f'Complete maintenance required: expected {expected} successes; observed {summaries[-1:]}.')
          if 'Storage Result: status=success' not in text:
              raise SystemExit('Successful managed save required.')
          publications = re.findall(r'Git Publication: status=(\w+).*?push=(\w+)', text)
          if not publications or publications[-1] != ('success', 'succeeded'):
              raise SystemExit('Successful Git publication required.')
          print(f'Verified {expected} successful Tasks, managed save and Git push.')
          PY

      - name: Upload Framework Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-modifier-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            modifier_logs.log
            modifier_console.log
          if-no-files-found: warn
